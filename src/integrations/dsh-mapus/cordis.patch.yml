# The patch layer for dsh-mapus: one row inserted into a profile, no host change.
#
# The row does one thing: mount the host half of the plugin. Once mounted it:
#   1. opens a loopback HTTP bridge on 127.0.0.1:7355 (the MAPUS side panel comes in here);
#   2. registers the MAPUS page / browser / local-execution capabilities as agent-scoped tools.
#
# Every key under config is optional, omit it to take the default:
#   token missing  -> generated on first start and written to $DSH_HOME/mapus-bridge/token (0600)
#   provider/model missing -> follow the profile default model
- insert:
    - id: mapus-bridge
      name: dsh-mapus
      config:
        host: 127.0.0.1
        port: 7355
