<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MAPUS 控制面板</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="icon" href="../icons/icon128.png">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon64.png" alt="MAPUS" class="brand-logo">
      <div class="brand-text">
        <h1 data-i18n>MAPUS 控制面板</h1>
        <span class="brand-sub" data-i18n>多站点批量扫描 · 一次下发</span>
      </div>
    </div>
    <div class="top-actions">
      <span id="statSites" class="top-stat" data-i18n>站点 0</span>
      <span id="statFindings" class="top-stat" data-i18n>风险 0</span>
      <span id="statRunning" class="top-stat" data-i18n>执行中 0</span>
      <button class="btn ghost sm" id="btnLang" title="语言"><span id="langText">中</span></button>
      <button class="btn ghost sm" id="btnTheme" title="主题：跟随系统（点击切换）" data-i18n-title="主题：跟随系统（点击切换）">
        <svg id="iconThemeAuto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14" style="vertical-align:-2px"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6v16.8M12 3.6a8.4 8.4 0 0 1 0 16.8" fill="currentColor" stroke="none" opacity=".45"/></svg>
        <svg id="iconThemeLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14" style="vertical-align:-2px" hidden><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
        <svg id="iconThemeDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14" style="vertical-align:-2px" hidden><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.6 8.6 0 1 0 10.8 10.8z"/></svg>
      </button>
      <button class="btn ghost sm" id="btnRefreshAll" data-i18n>刷新</button>
      <button class="btn ghost sm" id="btnOpenPanel" data-i18n>打开侧边栏</button>
      <span id="gateChip" class="gate-chip" data-state="on" role="switch">运行中</span>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="控制面板导航"></nav>

  <main class="panels">
    <section class="panel active" data-panel="overview" role="tabpanel"></section>
    <section class="panel" data-panel="sites" role="tabpanel"></section>
    <section class="panel" data-panel="tasks" role="tabpanel"></section>
    <section class="panel" data-panel="findings" role="tabpanel"></section>
    <section class="panel" data-panel="models" role="tabpanel"></section>
    <section class="panel" data-panel="settings" role="tabpanel"></section>
  </main>

  <script src="../i18n/core.js"></script>
  <script src="../i18n/panel.js"></script>
  <script src="../i18n/dom.js"></script>
  <script src="../background/pagefn.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
